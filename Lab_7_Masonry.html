            height: 100vh;
            overflow: hidden;
        }
        
        #LeftPanel{
            background-color: orange;
            min-height: 100vh;
            width: 100px;
            display: flex;
            flex-direction: column;
            
        }

        .PanelItem{

            width: 100px;
            height: 50px;
            text-align: center;
        }

        #PictureParent{
            display: flex;
            flex: 1;
            flex-direction: row;
            flex-wrap: wrap;
            overflow-y: auto;
            align-items: flex-start;
            gap: 5px;
        }

        .PictureChild{
            height: 100px;
            flex-grow: 1;
            object-fit: cover;
        }
