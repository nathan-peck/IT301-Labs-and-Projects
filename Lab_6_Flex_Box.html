<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .flex-parent{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
    </style>
</head>
<body>
    <div class="flex-parent">
        <div class="pic1">
            <img src="https://picsum.photos/100/100?random=1" alt="Picture 1">
        </div>
        <div class="pic2">
            <img src="https://picsum.photos/200/200?random=2" alt="Picture 2">
        </div>
        <div class="pic3">
            <img src="https://picsum.photos/100/100?random=3" alt="Picture 3">
        </div>
    </div>
</body>
</html>
