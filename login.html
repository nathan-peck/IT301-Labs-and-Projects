<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body>
    <form>
        <label for="email">
            Email:
        </label>
        <input type="email" id="email">
        <br><br>

        <label for="password">
            Password:
        </label>
        <input type="password" id="password">
        <br><br>

        <button type="button" id="login">
            Log In
        </button>

        <p id="message">

        </p>
    </form>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <!-- Handles user login -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCGmzu8N8x-IOsdE2TGybX8KYGFQhPCZmI",
            authDomain: "lab-16-9ecde.firebaseapp.com",
            projectId: "lab-16-9ecde",
            storageBucket: "lab-16-9ecde.firebasestorage.app",
            messagingSenderId: "987947731494",
            appId: "1:987947731494:web:b63514a34851a1af4d34e7"
        };

        // Connect to Firebase
        firebase.initializeApp(firebaseConfig);

        // Connect to Firestore
        const db = firebase.firestore();
        
        const auth = firebase.auth();

        const email = document.getElementById("email");
        const password= document.getElementById("password");
        const login = document.getElementById("login");
        const message = document.getElementById("message");

        

        login.addEventListener("click", async()=>{
            try {
                const cred = await auth.signInWithEmailAndPassword(
                email.value.trim(), password.value);
                const uid = cred.user.uid;
                const userDoc = await db.collection("users").doc(uid).get();
                const role = userDoc.data().role;
                if (role === "Faculty") {
                    window.location.href = "faculty.html";
                }
                else {
                    window.location.href = "student.html";
                }
            }
            catch (error) {
                message.textContent = "Login failed. Check your details.";
            }
        })
    </script>
</body>
</html>
