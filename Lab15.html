<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        let allPosts = [];

        const container = document.createElement("div");
        container.id = "postsContainer";

        const form = document.querySelector("form");
        form.appendChild(container);

        const renderPost = (post) => {
            const article = document.createElement("article");
            article.innerHTML = `
                <h2>${post.title}</h2>
                <p><strong>User ID:</strong> ${post.userId} | <strong>Post ID:</strong> ${post.id}</p>
                <p>${post.body}</p>
                <hr>
            `;
            container.appendChild(article);
        };

        const getPosts = async()=>{
            let posts = await fetch("https://jsonplaceholder.typicode.com/posts");
            allPosts = await posts.json();
            console.log(`--- All Posts ---`);
            console.table(allPosts);

            const container = document.getElementById("postsContainer");

            allPosts.forEach(post => {
                const article = document.createElement("article");

                article.innerHTML = `
                    <h2>${post.title}</h2>
                    <p><strong>User ID:</strong> ${post.userId} | <strong>Post ID:</strong> ${post.id}</p>
                    <p>${post.body}</p>
                    <hr>
                `;

                container.appendChild(article);
            })

        }

        const setupFilterButton = () => {
            const filterBtn = document.getElementById("filterBtn");
            const userSelect = document.getElementById("userID");

            filterBtn.addEventListener("click", () => {
                const selectedUserId = userSelect.value;

                if (selectedUserId === "") {
                    console.log("Please select a User ID first.");
                    return;
                }

                const filteredPosts = allPosts.filter(post => post.userId === Number(selectedUserId));

                
                console.log(`--- Posts for User ID: ${selectedUserId} ---`);
                console.table(filteredPosts);
            });
        }

        const setupDisplayUserButton = () => {
            const displayUserBtn = document.getElementById("displayUserBtn");
            const displayUserInput = document.getElementById("displayUserID");

            displayUserBtn.addEventListener("click", () => {
                const enteredUserId = displayUserInput.value;

                if (enteredUserId === "" || enteredUserId < 1 || enteredUserId > 10) {
                    alert("Please enter a valid User ID between 1 and 10.");
                    return;
                }

                document.querySelectorAll('article').forEach((article) => {
                    article.remove();
                });

                const filteredPosts = allPosts.filter(post => post.userId === Number(enteredUserId));

                filteredPosts.forEach(post => renderPost(post));
            });
        }

        const setupFindPostButton = () => {
            const findBtn = document.getElementById("findBtn");
            const postInput = document.getElementById("postID");

            findBtn.addEventListener("click", () => {
                const enteredPostId = postInput.value;

                if (enteredPostId === "") {
                    alert("Please enter a Post ID first.");
                    return;
                }

                document.querySelectorAll('article').forEach((article) => {
                    article.remove();
                });

                const existingError = document.getElementById("searchError");
                if (existingError) existingError.remove();

                const matchedPost = allPosts.find(post => post.id === Number(enteredPostId));

                if (matchedPost) {
                    renderPost(matchedPost);
                }

                else {
                    const errorMessage = document.createElement("article");
                    errorMessage.id = "searchError";
                    errorMessage.innerHTML = `
                        <h2>Post Not Found</h2>
                        <p>No post matching ID <strong>${enteredPostId}</strong> exists within our database system.</p>
                        <hr>
                    `;
                    container.appendChild(errorMessage);
                }
            });
        }

        getPosts();
        setupFilterButton();
        setupDisplayUserButton();
        setupFindPostButton();
    </script>


</body>
</html>
