<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 16 HTML Form</title>
    <style>
        .invalid {
            color: red;
        }
        .valid {
            color: green;
        }
    </style>
</head>
<body>
    <form>
        <label for="name">What is your name?</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <br>
        
        <label for="email">What is your email?</label>
        <input type="email" id="email" placeholder="username@example.com" required>
        <br>

        <label for="passwd">What is your password?</label>
        <input type="password" id="passwd" placeholder="Enter a strong password" required>
        <br>

        <div id="password-rules" style="display: none;">
            <p>Password requirements:</p>
            <ul>
                <li id="rule-length" class="invalid">At least 6 characters</li>
                <li id="rule-special" class="invalid">Must include a special character (!@#$...)</li>
                <li id="rule-uppercase" class="invalid">Must include an uppercase letter (A-Z)</li>
            </ul>
        </div>
        <br>

        <button id="button" type="submit">Submit</button>
    </form>

    <script>
        const passwordInput = document.getElementById("passwd");
        const passwordRules = document.getElementById("password-rules");
        
        const ruleLength = document.getElementById("rule-length");
        const ruleSpecial = document.getElementById("rule-special");
        const ruleUppercase = document.getElementById("rule-uppercase");

        passwordInput.addEventListener("input", () => {
            passwordRules.style.display = "block";

            const password = passwordInput.value;

            const hasMinLength = password.length >= 6;
            const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);
            const hasUppercase = /[A-Z]/.test(password);

            ruleLength.classList.toggle("valid", hasMinLength);
            ruleLength.classList.toggle("invalid", !hasMinLength);

            ruleSpecial.classList.toggle("valid", hasSpecialChar);
            ruleSpecial.classList.toggle("invalid", !hasSpecialChar);

            ruleUppercase.classList.toggle("valid", hasUppercase);
            ruleUppercase.classList.toggle("invalid", !hasUppercase);
        });

        document.querySelector("form").addEventListener("submit", (event) => {
            event.preventDefault();
            window.location.href = "success.html";
        })
    </script>


</body>
</html>
